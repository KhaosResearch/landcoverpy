[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landcoverpy"
version = "1.4.0"
description = "A scalable land cover classification workflow using Big Data techniques with Sentinel-2 data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antonio Manuel Burgueño Romero", email = "ambrbr@uma.es" }
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "geopandas>=0.14.4",
    "joblib>=1.3.2",
    "matplotlib>=3.5.3",
    "mgrs>=1.4.5",
    "minio>=7.2.8",
    "numpy>=1.26.3",
    "pandas>=2.1.4",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.0.0",
    "pymongo>=4.8.0",
    "pyproj>=3.4.0",
    "rasterio>=1.3.11",
    "lxml>=5.2.0",
    "scikit-learn>=1.1.2",
    "scipy>=1.14.1",
    "seaborn>=0.12.0",
    "sentinelsat>=1.1.1",
    "shapely>=2.0.0",
    "lz4>=4.3.3",
    "geojson>=2.5.0",
    "beautifulsoup4>=4.12.0",
    "distributed>=2024.12.0",
]

[project.urls]
Homepage = "https://github.com/KhaosResearch/landcoverpy"
"Bug Tracker" = "https://github.com/KhaosResearch/landcoverpy/issues"

[tool.setuptools.packages.find]
where = ["src"]