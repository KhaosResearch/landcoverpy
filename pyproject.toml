[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landcoverpy"
version = "1.4.0"
description = "A scalable land cover classification workflow using Big Data techniques with Sentinel-2 data."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antonio Manuel Burgueño Romero", email = "ambrbr@uma.es" },
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "geopandas==0.11.1",
    "joblib==1.1.0",
    "matplotlib==3.5.3",
    "mgrs==1.4.5",
    "minio==7.2.8",
    "numpy==1.26.3",
    "pandas==2.1.4",
    "pydantic==2.7.4",
    "pydantic-settings",
    "pymongo==4.8.0",
    "pyproj==3.4.0",
    "rasterio==1.3.11",
    "lxml==4.9.1",
    "scikit-learn==1.1.2",
    "scipy==1.14.1",
    "seaborn==0.12.0",
    "sentinelsat==1.1.1",
    "Shapely==1.8.4",
    "lz4==4.3.3",
    "geojson==2.5.0",
    "bs4==0.0.1",
    "distributed>=2024.8",
    "ds-download==0.1.4",
]

[project.urls]
Homepage = "https://github.com/KhaosResearch/landcoverpy"
"Bug Tracker" = "https://github.com/KhaosResearch/landcoverpy/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ds-download = { path = "../sentinel2-download-mediterranean-basin", editable = true }
