services:
  minio:
    image: minio/minio:RELEASE.2024-02-09T21-25-16Z
    container_name: minio
    environment:
      - MINIO_ROOT_USER=adminadmin
      - MINIO_ROOT_PASSWORD=adminadmin
    volumes:
      - ./minio_data:/data
      - ./minio_data2:/data2
      - ./minio_data3:/data3
    ports:
      - "31113:9001"
    command: server /data --console-address ":9001"


  mongo:
    image: mongo:4.2.19
    container_name: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=adminadmin
      - MONGO_INITDB_ROOT_PASSWORD=adminadmin
    volumes:
      - ./mongo_data:/data/db
    ports:
      - "31114:27017"

  landcoverpy:
    image: ghcr.io/khaosresearch/demo-landcoverpy:latest
    container_name: landcoverpy
    depends_on:
      - minio
      - mongo
    environment:
      - MINIO_HOST=minio
      - MONGO_HOST=mongo
      - MINIO_ACCESS_KEY=adminadmin
      - MINIO_SECRET_KEY=adminadmin
      - MONGO_USERNAME=adminadmin
      - MONGO_PASSWORD=adminadmin
      - GOOGLE_APPLICATION_CREDENTIALS=/app/data/gcloud-user.json # File can be generated in https://console.cloud.google.com/apis/credentials
      - MINIO_DATA_FOLDER_NAME=MEDIT_pure_Forests_v0 # Name of the folder where the data is stored in Minio. Use it like a "project" name.
      - MIN_USEFUL_DATA_PERCENTAGE=30 # Minimum percentage of useful data to be used in the composite (0 - 100). A high number will increase the quality of the composite but will decrease the number of products to be used, which can lead to a worse result. Recommended value: 30
      - MAX_PRODUCTS_COMPOSITE=5 # Number of products to be used in the composite. A high number will increase the processing time and memory usage (>=2). Recommended value: 4
      - TILES_TO_PREDICT=["28RFQ","28RFR","28RFS","28RGR","28RGS","29RKL","29RKM","29RLM","29RLN","29RMM","29RMN","29RMP","29RMQ","29RNN","29RNP","29RNQ","29RPP","29RPQ","29RQP","29RQQ","29SMA","29SMB","29SMC","29SMD","29SMR","29SMS","29SNA","29SNB","29SNC","29SND","29SNR","29SNS","29SNT","29SPA","29SPB","29SPC","29SPD","29SPR","29SPS","29SPT","29SQA","29SQB","29SQC","29SQD","29SQR","29SQS","29SQT","29SQU","29SQV","29TME","29TNE","29TNF","29TNG","29TNH","29TPE","29TPF","29TPG","29TPH","29TQE","29TQF","29TQG","29TQH","30RTU","30RTV","30RUV","30STA","30STB","30STC","30STD","30STE","30STF","30STG","30STH","30STJ","30SUA","30SUB","30SUC","30SUD","30SUE","30SUF","30SUG","30SUH","30SUJ","30SVA","30SVB","30SVC","30SVD","30SVE","30SVF","30SVG","30SVH","30SVJ","30SWA","30SWB","30SWC","30SWD","30SWE","30SWF","30SWG","30SWH","30SWJ","30SXA","30SXB","30SXC","30SXD","30SXE","30SXG","30SXH","30SXJ","30SYA","30SYB","30SYC","30SYD","30SYE","30SYF","30SYG","30SYH","30SYJ","30TTK","30TTL","30TTM","30TUK","30TUL","30TUM","30TUN","30TVK","30TVL","30TVM","30TVN","30TWK","30TWL","30TWM","30TWN","30TXK","30TXL","30TXM","30TXN","30TYK","30TYL","30TYM","30TYN","31SBA","31SBC","31SBD","31SBR","31SBS","31SBT","31SBU","31SBV","31SCA","31SCC","31SCD","31SCS","31SCT","31SCU","31SCV","31SDA","31SDD","31SDS","31SDT","31SDU","31SDV","31SEA","31SED","31SES","31SET","31SEU","31SEV","31SFA","31SFT","31SFU","31SFV","31SGA","31SGB","31SGU","31SGV","31TBE","31TBF","31TBG","31TCE","31TCF","31TCG","31TCH","31TDE","31TDF","31TDG","31TDH","31TDJ","31TDK","31TEE","31TEG","31TEH","31TEJ","31TEK","31TFE","31TFH","31TFJ","31TFK","31TFL","31TGH","31TGJ","31TGK","32SKD","32SKE","32SKF","32SLD","32SLE","32SLF","32SLG","32SMC","32SMD","32SME","32SMF","32SMG","32SMJ","32SNB","32SNC","32SND","32SNE","32SNF","32SNG","32SNJ","32SPA","32SPB","32SPC","32SPD","32SPE","32SPF","32SPG","32SQA","32SQB","32SQC","32SQD","32SQF","32SQG","32SQH","32TLN","32TLP","32TLQ","32TMK","32TML","32TMM","32TMN","32TMP","32TMQ","32TMR","32TNK